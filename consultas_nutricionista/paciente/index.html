<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas nutricionista</title>
</head>
<body>
    <center>
        <H1>Novo paciente</H1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required><br><br>
            <input type="date" placeholder="data" name="data" required><br><br>
            <input type="text" placeholder="Nome" name="nome_do_paciente" required><br><br>
            <input type="number" step="0.01" placeholder="massa corporal" name="peso" required><br><br>
            <input type="number" step="0.01" placeholder="altura do paciente" name="altura" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
