<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastros - Clubes de futebol</title>
</head>
<body>
    <center>
        <H1>Novo Cadastro</H1>
        <form action="http://127.0.0.1:3000" method="post">
            <input type="number" placeholder="Identificacao" name="id" required><br><br>
            <input type="text" placeholder="nome do clube" name="nome" required><br><br>
            <input type="number" placeholder=" numero de vitorias" name="vitorias" required><br><br>
            <input type="number" placeholder="numero de empates" name="empates" required><br><br>
            <input type="number" placeholder="numero de derrotas" name="derrotas" required><br><br>
            <button type="reset">Limpar</button>
            <button type="submit">Enviar</button>
        </form>
    </center>
</body>
</html>
